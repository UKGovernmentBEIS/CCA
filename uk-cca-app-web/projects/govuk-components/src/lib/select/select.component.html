<label [class.govuk-visually-hidden]="isLabelHidden()" [for]="identifier" [id]="'l.' + identifier" class="govuk-label">
  {{ currentLabel() }}
</label>

@if (hint()) {
  <div [id]="identifier + '-hint'" class="govuk-hint">{{ hint() }}</div>
}

@if (shouldDisplayErrors) {
  <govuk-error-message [errors]="control.errors" [identifier]="identifier" />
}

<select
  [formControl]="control"
  [id]="identifier"
  [attr.name]="identifier"
  [attr.aria-describedby]="
    describedBy(hint() ? identifier + '-hint' : null, shouldDisplayErrors ? identifier + '-error' : null)
  "
  [ngClass]="widthClass()"
  class="govuk-select"
  [class.govuk-select--error]="shouldDisplayErrors"
  govukFormError
>
  @for (option of options(); track option.value) {
    <option [attr.disabled]="option.disabled || null" [ngValue]="option.value">
      {{ option.text }}
    </option>
  }
  <ng-content />
</select>
