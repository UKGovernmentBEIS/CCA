@if (showCookiesBanner() === true) {
  <cca-cookies-container />
}

<govuk-skip-link />

<header class="govuk-template__header">
  <govuk-header>
    @if (isLoggedIn()) {
      <button type="button" class="govuk-link govuk-link--inverse" (click)="authService.logout()">Sign out</button>
    }
  </govuk-header>

  <govuk-service-navigation
    serviceName="Manage your Climate Change Agreements"
    [serviceHomepage]="serviceHomepage()"
    [navigation]="navigation()"
  />
</header>

<div class="govuk-width-container">
  <section aria-label="Task information">
    <cca-workflow-task-header />
  </section>

  <netz-breadcrumbs />
  <netz-back-link />

  <main class="govuk-main-wrapper" id="main-content" tabindex="-1">
    <router-outlet ccaMainContentFocus />
  </main>
</div>

<div class="govuk-width-container">
  <cca-phase-bar [isUserLoggedIn]="isLoggedIn()" />
</div>

<footer class="govuk-template__footer">
  <govuk-footer [meta]="footerMeta" />
</footer>

<cca-timeout-banner />
