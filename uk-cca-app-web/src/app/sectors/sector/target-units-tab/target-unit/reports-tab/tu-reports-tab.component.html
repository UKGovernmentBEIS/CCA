<div class="govuk-grid-row">
  <div class="govuk-grid-column-one-quarter">
    <h2>Reports</h2>
    <nav class="cca-side-navigation" aria-label="Side navigation">
      <ul class="cca-side-navigation__list">
        <li
          class="cca-side-navigation__item"
          [class.cca-side-navigation__item--active]="currentSection === 'performance'"
        >
          <a
            class="govuk-link"
            [routerLink]="[]"
            [queryParams]="{ section: 'performance' }"
            queryParamsHandling="merge"
            fragment="reports"
            [attr.aria-current]="currentSection === 'performance' ? 'location' : null"
          >
            Performance
          </a>
        </li>
        <li class="cca-side-navigation__item" [class.cca-side-navigation__item--active]="currentSection === 'pat'">
          <a
            class="govuk-link"
            [routerLink]="[]"
            [queryParams]="{ section: 'pat' }"
            queryParamsHandling="merge"
            fragment="reports"
            [attr.aria-current]="currentSection === 'pat' ? 'location' : null"
          >
            PAT
          </a>
        </li>
      </ul>
    </nav>
  </div>

  @if (currentSection === 'performance') {
    <div class="govuk-grid-column-three-quarters govuk-!-margin-top-5">
      <cca-performance-report />
    </div>
  } @else {
    <div class="govuk-grid-column-three-quarters govuk-!-margin-top-5">
      <cca-pat-report />
    </div>
  }
</div>
