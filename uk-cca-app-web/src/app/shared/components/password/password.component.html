<section data-testid="password-form">
  <div
    autoComplete="username email"
    class="govuk-!-display-none"
    formControlName="email"
    govuk-text-input
    inputType="email"
    label="Email"
  ></div>

  <div class="govuk-grid-row row-flex">
    <div class="govuk-grid-column-three-quarters">
      <div
        class="govuk-!-margin-bottom-0"
        autoComplete="new-password"
        formControlName="password"
        govuk-text-input
        [inputType]="passwordInputType()"
        [label]="passwordLabel()"
        hint="Your password must be 12 characters or longer and can include letters, numbers and symbols or a combination of three random words."
      ></div>
    </div>

    <div class="govuk-grid-column-one-quarter align-self-end" style="margin-bottom: 2px">
      <button govukSecondaryButton class="govuk-!-margin-bottom-0" type="button" (click)="togglePassword()">
        {{ showLabel() }}
      </button>
    </div>
  </div>

  <div class="govuk-grid-row govuk-!-margin-top-6">
    <div class="govuk-grid-column-three-quarters">
      <div
        autoComplete="new-password"
        formControlName="validatePassword"
        govuk-text-input
        [inputType]="passwordInputType()"
        [label]="confirmPasswordLabel()"
      ></div>
    </div>
  </div>
</section>
