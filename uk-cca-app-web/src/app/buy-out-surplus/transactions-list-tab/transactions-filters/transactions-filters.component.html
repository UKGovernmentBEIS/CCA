<cca-utility-panel heading="Filters">
  <form [formGroup]="filtersForm" (ngSubmit)="apply()">
    <div class="govuk-grid-row row-flex flex-wrap align-items-end">
      <div class="govuk-grid-column-one-half">
        <div
          govuk-text-input
          formControlName="term"
          label="Target unit ID, operator name, transaction ID, sector ID, facility ID or site name"
          widthClass="govuk-!-width-full"
        ></div>
      </div>

      <div class="govuk-grid-column-one-half">
        <div class="govuk-grid-row row-flex align-items-end">
          <div class="govuk-grid-column-one-third">
            <div
              govuk-select
              formControlName="schemeVersion"
              [options]="schemeVersionOptions"
              label="Scheme"
              widthClass="govuk-!-width-full"
            ></div>
          </div>

          <div class="govuk-grid-column-one-third">
            <div
              govuk-select
              formControlName="targetPeriodType"
              [options]="targetPeriodOptions()"
              label="Period"
              widthClass="govuk-!-width-full"
            ></div>
          </div>

          <div class="govuk-grid-column-one-third">
            <div
              govuk-select
              formControlName="paymentStatus"
              [options]="statusOptions"
              label="Status"
              widthClass="govuk-!-width-full"
            ></div>
          </div>
        </div>
      </div>
    </div>

    <div class="govuk-grid-row">
      <div class="govuk-grid-column-one-quarter">
        <button govukButton type="submit" class="govuk-!-margin-right-3">Apply</button>
        <button govukSecondaryButton type="button" (click)="clear()">Clear</button>
      </div>
    </div>
  </form>
</cca-utility-panel>
